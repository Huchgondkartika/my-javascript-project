    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div class="Choices">
         <div class="Choice" id="rock">
        <img src="C:\javaScript\project2\rock.png"/>
